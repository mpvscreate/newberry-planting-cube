<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UK Cube — Kent School Garden</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg:#f5f3ec; --surface:#fff; --surface2:#f0ede3;
  --ink:#1a2014; --ink2:#4a5040; --ink3:#8a9080;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.16);
  --radius:10px; --radius-lg:16px; --radius-xl:24px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
[data-theme="dark"] {
  --bg:#111710; --surface:#1c2419; --surface2:#232d1e;
  --ink:#e8ede0; --ink2:#a8b4a0; --ink3:#6a7860;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.16);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111710; --surface:#1c2419; --surface2:#232d1e;
    --ink:#e8ede0; --ink2:#a8b4a0; --ink3:#6a7860;
    --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.16);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);white-space:nowrap}

/* ── APP SHELL ── */
#shell{display:flex;flex-direction:column;height:100svh}

/* ── TOP BAR ── */
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:var(--ink);color:#fff;flex-shrink:0;z-index:10}
.bar-logo{height:36px;width:auto;border-radius:5px;flex-shrink:0;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4))}
.bar-title{flex:1;min-width:0}
.bar-eyebrow{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,0.5);margin-bottom:1px}
.bar-h1{font-size:17px;font-weight:500;color:#fff;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-actions{display:flex;gap:6px;flex-shrink:0}
.ibtn{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:12px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);
  border:.5px solid rgba(255,255,255,.2);padding:6px 11px;border-radius:999px;
  cursor:pointer;min-height:32px;white-space:nowrap;transition:background .15s}
.ibtn:hover{background:rgba(255,255,255,.22)}
.ibtn i{font-size:15px}
.ibtn .lbl{display:none}
@media(min-width:520px){.ibtn .lbl{display:inline}}

/* ── AGE TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:8px;padding:6px 14px;
  background:var(--surface);border-bottom:.5px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface2);
  padding:3px;border-radius:999px;border:.5px solid var(--border)}
.seg button{font-family:inherit;font-size:11.5px;border:none;background:transparent;
  color:var(--ink2);padding:5px 12px;border-radius:999px;cursor:pointer;min-height:28px;
  transition:all .18s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ── 3D STAGE ── */
.stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:transparent}
#scene:active{cursor:grabbing}
.stage-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--ink3);pointer-events:none;white-space:nowrap;
  background:var(--surface);padding:4px 12px;border-radius:999px;
  border:.5px solid var(--border)}

/* ── FACE PANEL (full-screen overlay) ── */
#facePanel{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
  overflow:hidden
}
#facePanel.open{opacity:1;pointer-events:auto}
#facePanel.open .fp-inner{transform:translateY(0)}
.fp-inner{display:flex;flex-direction:column;height:100%;
  transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#facePanel.open .fp-inner{transform:translateY(0)}

.fp-header{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-shrink:0;
  border-bottom:.5px solid rgba(255,255,255,.15)}
.fp-back{display:inline-flex;align-items:center;gap:6px;font-family:inherit;
  font-size:13px;background:rgba(0,0,0,.18);color:#fff;
  border:.5px solid rgba(255,255,255,.25);padding:7px 13px;
  border-radius:999px;cursor:pointer;min-height:34px;transition:background .15s}
.fp-back:hover{background:rgba(0,0,0,.32)}
.fp-htitle{flex:1;min-width:0}
.fp-eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.6);display:block;margin-bottom:2px}
.fp-name{font-size:22px;font-weight:500;color:#fff;letter-spacing:-.02em}
.fp-season-icon{font-size:30px;color:rgba(255,255,255,.5);flex-shrink:0}

.fp-body{flex:1;overflow-y:auto;padding:20px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.2) transparent}
.fp-body::-webkit-scrollbar{width:4px}
.fp-body::-webkit-scrollbar-track{background:transparent}
.fp-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:999px}

/* plant grid */
.plant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;
  max-width:900px;margin:0 auto}

.plant-card{background:rgba(255,255,255,.12);border:.5px solid rgba(255,255,255,.2);
  border-radius:var(--radius-lg);padding:18px 16px;cursor:pointer;
  transition:background .18s,transform .18s,border-color .18s;
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
  backdrop-filter:blur(4px)}
.plant-card:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4);
  transform:translateY(-2px)}
.plant-card-icon{width:48px;height:48px;background:rgba(255,255,255,.15);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff;flex-shrink:0}
.plant-card-name{font-size:15px;font-weight:500;color:#fff;line-height:1.3}
.plant-card-meta{font-size:11.5px;color:rgba(255,255,255,.65);line-height:1.5}
.plant-card-dur{font-size:11px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:4px}
.plant-card-dur i{font-size:12px}
.diff-bar{display:flex;gap:3px;margin-top:auto}
.diff-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
.diff-dot.on{background:rgba(255,255,255,.9)}
.plant-card.dimmed{opacity:.35}
.plant-card.dimmed:hover{opacity:.55}
.plant-card .arr{position:absolute;bottom:14px;right:14px;font-size:16px;
  color:rgba(255,255,255,.4);transition:color .15s,transform .15s}
.plant-card:hover .arr{color:rgba(255,255,255,.8);transform:translateX(2px)}

/* ── DETAIL SHEET (slides from right) ── */
#detailSheet{
  position:fixed;inset:0;z-index:200;pointer-events:none;
  display:flex;align-items:stretch;justify-content:flex-end
}
#detailSheet.open{pointer-events:auto}
.ds-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0);
  transition:background .3s;cursor:pointer}
#detailSheet.open .ds-backdrop{background:rgba(0,0,0,.4)}
.ds-panel{position:relative;width:min(520px,100%);height:100%;
  background:var(--surface);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:-4px 0 40px rgba(0,0,0,.18)}
#detailSheet.open .ds-panel{transform:translateX(0)}

.ds-head{padding:18px 20px 16px;flex-shrink:0;position:relative}
.ds-head-color{position:absolute;inset:0;opacity:.12}
.ds-close{position:absolute;top:14px;right:14px;width:32px;height:32px;
  border-radius:50%;border:none;background:var(--surface2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
  font-size:18px;z-index:1;transition:background .15s}
.ds-close:hover{background:var(--border2)}
.ds-season-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;
  border-radius:999px;margin-bottom:10px;font-weight:500;position:relative;z-index:1}
.ds-title{font-size:26px;font-weight:500;letter-spacing:-.02em;
  color:var(--ink);position:relative;z-index:1;line-height:1.2}
.ds-sub{font-size:13px;color:var(--ink3);margin-top:4px;position:relative;z-index:1}
.ds-meta{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;position:relative;z-index:1}
.ds-meta-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}
.ds-meta-item i{font-size:14px}
.diff-chips{display:flex;gap:3px;align-items:center}
.dc{width:8px;height:8px;border-radius:50%;background:var(--border2)}
.dc.on{/* set via JS */}

.ds-body{flex:1;overflow-y:auto;padding:4px 0 20px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.ds-body::-webkit-scrollbar{width:4px}
.ds-section{padding:0 20px 16px;border-bottom:.5px solid var(--border)}
.ds-section:last-child{border-bottom:none}
.ds-field{display:grid;grid-template-columns:108px 1fr;gap:6px 12px;
  padding:10px 0;border-bottom:.5px solid var(--border);align-items:start}
.ds-field:last-child{border-bottom:none}
.ds-k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);display:flex;align-items:center;gap:5px;padding-top:2px}
.ds-k i{font-size:14px}
.ds-v{font-size:13.5px;color:var(--ink);line-height:1.55}

.ds-activity{margin:16px 20px 0;padding:14px;border-radius:var(--radius);
  border-left:3px solid}
.ds-activity-label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.ds-activity-text{font-size:13.5px;color:var(--ink);line-height:1.6}

.ds-hs{margin:14px 20px 0}
.ds-hs-label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.ds-hs-chips{display:flex;flex-wrap:wrap;gap:6px}
.ds-hs-chip{font-family:inherit;font-size:12px;padding:6px 11px;
  border-radius:999px;cursor:pointer;background:var(--surface2);
  color:var(--ink2);border:.5px solid var(--border2);transition:all .15s}
.ds-hs-chip:hover{background:var(--border);color:var(--ink)}

.ds-journey-btn{display:flex;align-items:center;justify-content:center;gap:7px;
  width:calc(100% - 40px);margin:16px 20px 0;padding:13px;
  border-radius:var(--radius);border:none;font-family:inherit;font-size:14px;
  font-weight:500;color:#fff;cursor:pointer;transition:filter .15s}
.ds-journey-btn:hover{filter:brightness(1.1)}

/* ── JOURNEY (lifecycle) overlay within detail sheet ── */
.ds-journey{display:none;flex-direction:column;height:100%}
.ds-journey.active{display:flex}
.ds-info.hidden{display:none}

.journey-list{padding:0 20px 20px;flex:1;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.journey-item{display:flex;gap:14px;padding:14px 0;
  border-bottom:.5px solid var(--border);align-items:flex-start}
.journey-item:last-child{border-bottom:none}
.ji-num{width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:500;flex-shrink:0;color:#fff}
.ji-icon{font-size:16px}
.ji-name{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:3px}
.ji-note{font-size:13px;color:var(--ink2);line-height:1.55}

/* ── HERB PANEL ── */
#herbPanel{
  position:fixed;inset:0;z-index:300;
  display:flex;flex-direction:column;
  background:var(--bg);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
#herbPanel.open{opacity:1;pointer-events:auto}
.herb-head{padding:14px 20px;background:var(--ink);display:flex;align-items:center;gap:12px;flex-shrink:0}
.herb-head-title{flex:1;font-size:18px;font-weight:500;color:#fff}
.herb-tabs{display:flex;gap:0;background:var(--surface);border-bottom:.5px solid var(--border);flex-shrink:0}
.herb-tab-btn{font-family:inherit;font-size:12.5px;padding:10px 16px;
  border:none;background:transparent;color:var(--ink2);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.herb-tab-btn.active{color:var(--ink);border-bottom-color:var(--ink)}
.herb-scroll{flex:1;overflow-y:auto;padding:16px 20px;scrollbar-width:thin}
.herb-item-card{background:var(--surface);border:.5px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;margin-bottom:10px}
.herb-item-name{font-size:15px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;gap:8px;margin-bottom:8px}
.herb-item-name i{font-size:18px}
.herb-field{font-size:13px;color:var(--ink2);line-height:1.55;margin-bottom:6px}
.herb-field b{color:var(--ink);font-weight:500}
.herb-caution{font-size:12px;color:#9e3d1d;display:flex;gap:6px;
  background:#fdf0ea;border-radius:var(--radius);padding:8px 10px;margin-top:6px;line-height:1.5}
[data-theme="dark"] .herb-caution{color:#f9b08c;background:rgba(216,90,48,.12)}
.herb-caution i{flex-shrink:0;font-size:14px;margin-top:1px}
.herb-age-card{background:var(--surface2);border-radius:var(--radius);padding:10px 12px;
  font-size:13px;color:var(--ink2);margin-bottom:8px;line-height:1.55}
.herb-age-card b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:4px}

/* ── THEME TRANSITION ── */
body{transition:background .25s,color .25s}

/* ── FOCUS VISIBLE ── */
:focus-visible{outline:2px solid #4a90d9;outline-offset:2px;border-radius:4px}
.ibtn:focus-visible{outline-color:rgba(255,255,255,.8)}
.fp-back:focus-visible{outline-color:rgba(255,255,255,.8)}
.seg button:focus-visible{outline-offset:1px}
.plant-card:focus-visible{outline-color:rgba(255,255,255,.8);transform:translateY(-2px)}
.ds-hs-chip:focus-visible{outline-offset:1px}
.herb-tab-btn:focus-visible{outline-offset:1px}
#scene:focus-visible{outline:2px solid #4a90d9;outline-offset:-2px;border-radius:0}

/* ── CONTRAST FIXES ── */
.bar-eyebrow{color:rgba(255,255,255,0.7)}
.fp-eyebrow{color:rgba(255,255,255,.75)}
.plant-card-dur{color:rgba(255,255,255,.7)}

/* ── REDUCED MOTION ── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;
    transition-duration:0.01ms!important}
  .plant-card:hover{transform:none}
}
</style>
</head>

function hexToRgb(hex){
  const n=parseInt(hex.slice(1),16);
  return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];
}

function makeTexture(faceKey){
  const f=FACES[faceKey];
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const S=256, c=document.createElement('canvas'); c.width=c.height=S;
  const ctx=c.getContext('2d');
  // background
  ctx.fillStyle=dark?'#1c2419':'#faf9f4';
  roundRect(ctx,6,6,S-12,S-12,22); ctx.fill();
  // color wash
  ctx.fillStyle=f.color+'28'; roundRect(ctx,6,6,S-12,S-12,22); ctx.fill();
  // border
  ctx.strokeStyle=f.color+'88'; ctx.lineWidth=3;
  roundRect(ctx,6,6,S-12,S-12,22); ctx.stroke();
  // top bar
  ctx.fillStyle=f.color; roundRect(ctx,6,6,S-12,36,22,true); ctx.fill();
  // season icon
  ctx.font='54px serif'; ctx.textAlign='center';
  ctx.fillText(FACE_ICONS[faceKey],S/2,S/2+10);
  // face name
  ctx.fillStyle=dark?'#e8ede0':'#1a2014';
  ctx.font='500 19px -apple-system,system-ui,sans-serif';
  wrapText(ctx,f.name,S/2,192,S-36,22);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4; return tex;
}

function roundRect(ctx,x,y,w,h,r,topOnly){
  ctx.beginPath();
  if(topOnly){
    ctx.moveTo(x,y+h); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h); ctx.closePath(); return;
  }
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function wrapText(ctx,text,x,y,maxW,lh){
  const words=text.split(' '); let line=''; const lines=[];
  for(const w of words){ const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t; }
  lines.push(line);
  const start=y-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,start+i*lh));
}

function buildCube(){
  stickerMeshes.forEach(m=>{
    if(m.material.map) m.material.map.dispose();
    m.material.dispose();
    m.geometry.dispose();
  });
  while(cube.children.length){
    const child=cube.children[0];
    if(child.geometry) child.geometry.dispose();
    cube.remove(child);
  }
  stickerMeshes.length=0; hovered=null;
  const gap=0.06, sz=1.0;
  for(let x=-1;x<=1;x++) for(let y=-1;y<=1;y++) for(let z=-1;z<=1;z++){
    if(x===0&&y===0&&z===0) continue;
    const cubie=new THREE.Mesh(new THREE.BoxGeometry(sz,sz,sz),bodyMat);
    cubie.position.set(x*(sz+gap),y*(sz+gap),z*(sz+gap));
    cubie.castShadow=true; cubie.receiveShadow=true; cube.add(cubie);
    ['+x','-x','+y','-y','+z','-z'].forEach(d=>addFaceSticker(cubie,d,x,y,z));
  }
}

function addFaceSticker(cubie,dir,x,y,z){
  const out=(dir==='+x'&&x===1)||(dir==='-x'&&x===-1)||(dir==='+y'&&y===1)||
            (dir==='-y'&&y===-1)||(dir==='+z'&&z===1)||(dir==='-z'&&z===-1);
  if(!out) return;
  const faceKey=FACE_OF[dir];
  const tex=makeTexture(faceKey);
  const f=FACES[faceKey];
  const rgb=hexToRgb(f.color);
  const mat=new THREE.MeshStandardMaterial({map:tex,roughness:0.5,metalness:0.0,
    transparent:true,emissive:new THREE.Color(...rgb),emissiveIntensity:0.08});
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(0.88,0.88),mat);
  const o=0.502;
  if(dir==='+x'){plane.position.x=o;plane.rotation.y=Math.PI/2;}
  if(dir==='-x'){plane.position.x=-o;plane.rotation.y=-Math.PI/2;}
  if(dir==='+y'){plane.position.y=o;plane.rotation.x=-Math.PI/2;}
  if(dir==='-y'){plane.position.y=-o;plane.rotation.x=Math.PI/2;}
  if(dir==='+z'){plane.position.z=o;}
  if(dir==='-z'){plane.position.z=-o;plane.rotation.y=Math.PI;}
  plane.userData={faceKey};
  cubie.add(plane); stickerMeshes.push(plane);
}

function applyAgeHighlight(){
  const allow=AGE_DIFF[ageId]||[1,2,3];
  stickerMeshes.forEach(m=>{
    const fk=m.userData.faceKey;
    const ids=LAYOUT[fk]||[];
    const hasAllowed=ids.some(id=>{const it=lookup(fk,id);return allow.includes(it.diff);});
    m.material.emissiveIntensity=hasAllowed?0.08:0.02;
    m.material.opacity=hasAllowed?1:0.5;
  });
}

let velX=0,velY=0;
const targetRot={x:-0.3,y:-0.55}; cube.rotation.x=targetRot.x; cube.rotation.y=targetRot.y;
let dragging=false,lastX=0,lastY=0,moved=0,pinchDist=0;
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();

function pointerNDC(e){
  const r=canvas.getBoundingClientRect();
  ptr.x=((e.clientX-r.left)/r.width)*2-1;
  ptr.y=-((e.clientY-r.top)/r.height)*2+1;
}

canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'&&!e.isPrimary) return;
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY; velX=velY=0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  pointerNDC(e); updateHover();
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);
  targetRot.y+=dx*0.008;
  targetRot.x=Math.max(-1.3,Math.min(1.3,targetRot.x+dy*0.008));
  velY=dx*0.008; velX=dy*0.008;
});
canvas.addEventListener('pointerup',e=>{
  dragging=false;
  if(moved<8){pointerNDC(e); tryOpenFace();}
});
canvas.addEventListener('pointercancel',()=>{dragging=false;pinchDist=0;});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  camDist=Math.max(5.5,Math.min(13,camDist+e.deltaY*0.01));
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinchDist) camDist=Math.max(5.5,Math.min(13,camDist-(d-pinchDist)*0.02));
    pinchDist=d;
  }
},{passive:false});
canvas.addEventListener('touchend',()=>pinchDist=0);
canvas.addEventListener('touchcancel',()=>pinchDist=0);

function updateHover(){
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(stickerMeshes,false)[0];
  const obj=hit?hit.object:null;
  if(hovered&&hovered!==obj){hovered.material.emissiveIntensity=0.08; hovered.scale.setScalar(1);}
  if(obj){obj.material.emissiveIntensity=0.38; obj.scale.setScalar(1.04); canvas.style.cursor='pointer';}
  else canvas.style.cursor=dragging?'grabbing':'grab';
  hovered=obj;
}

function tryOpenFace(){
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(stickerMeshes,false)[0];
  if(!hit) return;
  openFacePanel(hit.object.userData.faceKey);
}

function resize(){
  const w=canvas.clientWidth||canvas.offsetWidth, h=canvas.clientHeight||canvas.offsetHeight; if(!w||!h) return;
  const dpr=Math.min(devicePixelRatio,2);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    renderer.setPixelRatio(dpr); renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
  }
}

function loop(){
  requestAnimationFrame(loop);
  if(!renderer||document.hidden) return;
  resize();
  if(!dragging){
    targetRot.x+=velX; targetRot.y+=velY; velX*=0.93; velY*=0.93;
    targetRot.x=Math.max(-1.3,Math.min(1.3,targetRot.x));
  }
  cube.rotation.x+=(targetRot.x-cube.rotation.x)*0.12;
  cube.rotation.y+=(targetRot.y-cube.rotation.y)*0.12;
  camera.position.z+=(camDist-camera.position.z)*0.12;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
// Delay init until canvas has layout
function startApp(){
  try { buildCube(); } catch(e) { console.error('buildCube:',e); }
  try { loop(); } catch(e) { console.error('loop:',e); }
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',()=>setTimeout(startApp,0));
} else {
  setTimeout(startApp,0);
}

if(typeof ResizeObserver!=='undefined'){
  new ResizeObserver(()=>{ resize(); if(renderer&&scene&&camera) renderer.render(scene,camera); }).observe(canvas);
}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();});
canvas.addEventListener('webglcontextrestored',()=>{buildCube();});

/* ================================================================
   FOCUS TRAP
   ================================================================ */
function trapFocus(el){
  el.addEventListener('keydown',e=>{
    if(e.key!=='Tab') return;
    const focusable=el.querySelectorAll('button,a,[href],[tabindex]:not([tabindex="-1"]),input,select,textarea');
    if(!focusable.length) return;
    const first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
}
trapFocus(document.getElementById('facePanel'));
trapFocus(document.getElementById('detailSheet'));
trapFocus(document.getElementById('herbPanel'));

/* ================================================================
   FACE PANEL
   ================================================================ */
let currentFace=null;
const facePanel=document.getElementById('facePanel');
const fpInner=document.getElementById('fpInner');
const fpHeader=document.getElementById('fpHeader');
const fpBack=document.getElementById('fpBack');
const fpEyebrow=document.getElementById('fpEyebrow');
const fpName=document.getElementById('fpName');
const fpIconEl=document.getElementById('fpIcon');
const plantGrid=document.getElementById('plantGrid');

fpBack.onclick=()=>closeFacePanel();

function openFacePanel(faceKey){
  currentFace=faceKey;
  const f=FACES[faceKey];
  facePanel.setAttribute('aria-hidden','false');
  fpHeader.style.background=f.color;
  fpInner.style.background=f.color+'f0';
  facePanel.style.background=f.color+'f5';
  fpEyebrow.textContent='Kent · Garden of England · '+f.name;
  fpName.textContent=f.name;
  fpIconEl.className='fp-season-icon ti '+f.icon;
  buildPlantGrid(faceKey);
  facePanel.classList.add('open');
  fpBack.focus();
  document.getElementById('srStatus').textContent=f.name+' panel open — '+LAYOUT[faceKey].length+' Kent plants shown.';
}

function closeFacePanel(){
  facePanel.classList.remove('open');
  facePanel.setAttribute('aria-hidden','true');
  currentFace=null;
  canvas.focus();
}

function buildPlantGrid(faceKey){
  const f=FACES[faceKey];
  const allow=AGE_DIFF[ageId]||[1,2,3];
  const ids=LAYOUT[faceKey];
  plantGrid.innerHTML='';
  ids.forEach(id=>{
    const it=lookup(faceKey,id);
    const allowed=allow.includes(it.diff);
    const icon=PLANT_ICONS[id]||'🌱';
    const diffWord=['','Easy','Moderate','Advanced'][it.diff];
    const div=document.createElement('div');
    div.className='plant-card'+(allowed?'':' dimmed');
    div.setAttribute('data-id',id);
    div.innerHTML=
      '<div class="plant-card-icon">'+icon+'</div>'+
      '<div class="plant-card-name">'+it.name+'</div>'+
      '<div class="plant-card-meta">'+it.months+'</div>'+
      '<div class="plant-card-dur"><i class="ti ti-clock" aria-hidden="true"></i> '+it.duration+'</div>'+
      '<div class="diff-bar">'+
        [1,2,3].map(i=>'<div class="diff-dot'+(i<=it.diff?' on':'')+'"></div>').join('')+
        '<span style="font-size:10px;color:rgba(255,255,255,.5);margin-left:4px">'+diffWord+'</span>'+
      '</div>'+
      '<i class="ti ti-arrow-right arr" aria-hidden="true"></i>';
    div.onclick=()=>openDetail(faceKey,id);
    div.setAttribute('role','button');
    div.setAttribute('tabindex','0');
    div.setAttribute('aria-label','Open '+it.name+' planting guide');
    div.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(faceKey,id);}};
    plantGrid.appendChild(div);
  });
}

/* ================================================================
   DETAIL SHEET
   ================================================================ */
let currentDetail=null;
const detailSheet=document.getElementById('detailSheet');
const dsBackdrop=document.getElementById('dsBackdrop');
const dsClose=document.getElementById('dsClose');
const dsHeadColor=document.getElementById('dsHeadColor');
const dsPill=document.getElementById('dsPill');
const dsTitle=document.getElementById('dsTitle');
const dsSub=document.getElementById('dsSub');
const dsMeta=document.getElementById('dsMeta');
const dsBody=document.getElementById('dsBody');
const dsInfo=document.getElementById('dsInfo');
const dsJourney=document.getElementById('dsJourney');
const journeyList=document.getElementById('journeyList');

dsBackdrop.onclick=()=>closeDetail();
dsClose.onclick=()=>closeDetail();

function openDetail(faceKey,id){
  currentDetail={faceKey,id};
  detailSheet.setAttribute('aria-hidden','false');
  const it=lookup(faceKey,id);
  const f=FACES[faceKey];
  // head
  dsHeadColor.style.background=f.color;
  dsPill.style.background=f.pill;
  dsPill.style.color=f.color;
  dsPill.innerHTML='<i class="ti '+f.icon+'" style="font-size:12px" aria-hidden="true"></i> '+f.name;
  dsTitle.textContent=it.name;
  dsSub.textContent=it.months;
  // meta
  const diffWord=['','Easy','Moderate','Advanced'][it.diff];
  dsMeta.innerHTML=
    '<div class="ds-meta-item"><i class="ti ti-clock" aria-hidden="true"></i> '+it.duration+'</div>'+
    '<div class="ds-meta-item"><div class="diff-chips">'+
      [1,2,3].map(i=>{
        const on=i<=it.diff;
        return '<div class="dc'+(on?' on':'')+'" style="'+(on?'background:'+f.color:'')+'"></div>';
      }).join('')+
    '</div> '+diffWord+'</div>';
  // body
  const ag=it.g?(it.g[ageId]||it.g.l):'';
  const ageLabel=AGES.find(a=>a.id===ageId).label;
  const isHigh=ageId==='h';
  let hsHtml='';
  if(isHigh&&it.hs){
    hsHtml='<div class="ds-hs">'+
      '<div class="ds-hs-label"><i class="ti ti-friends" aria-hidden="true"></i> Garden Team enquiry</div>'+
      '<div class="ds-hs-chips">'+
        it.hs.map(h=>'<button class="ds-hs-chip" onclick="sendPromptSafe(\'For the Garden Team at UK Cube, outline a '+h.replace(/'/g,"\\'")+' investigation using '+it.name.replace(/'/g,"\\'")+' from our school garden — with a hypothesis, method, variables, and how to present the data.\')">'+h+'</button>').join('')+
      '</div></div>';
  }
  dsBody.innerHTML=
    '<div style="padding:16px 20px 0">'+
      field('ti-calendar','Plant in',it.months)+
      field('ti-shovel','Soil',it.soil)+
      field('ti-recycle','Compost',it.compost)+
      field('ti-droplet','Water',it.water)+
      field('ti-friends','Companions',it.companions)+
      field('ti-bug','Watch for',it.pests)+
      field('ti-shield','Organic control',it.control)+
      field('ti-basket','Harvest',it.harvest)+
    '</div>'+
    '<div class="ds-activity" style="background:'+f.color+'14;border-left-color:'+f.color+'">'+
      '<div class="ds-activity-label" style="color:'+f.color+'">'+
        '<i class="ti ti-eye" aria-hidden="true"></i> '+(isHigh?'Garden Team investigation':'Observe & do')+' · '+ageLabel+
      '</div>'+
      '<div class="ds-activity-text">'+ag+'</div>'+
    '</div>'+
    hsHtml+
    '<button class="ds-journey-btn" style="background:'+f.color+'" onclick="startJourney()">'+
      '<i class="ti ti-leaf" aria-hidden="true"></i> Garden journey — seed to soil'+
    '</button>';
  showInfo();
  detailSheet.classList.add('open');
  dsClose.focus();
}

function field(icon,k,v){
  return '<div class="ds-field"><div class="ds-k"><i class="ti '+icon+'" aria-hidden="true"></i>'+k+'</div><div class="ds-v">'+v+'</div></div>';
}

function showInfo(){dsInfo.classList.remove('hidden');dsJourney.classList.remove('active');}
function closeDetail(){
  detailSheet.classList.remove('open');
  detailSheet.setAttribute('aria-hidden','true');
  const trigger=currentDetail?document.querySelector('.plant-card[data-id="'+currentDetail.id+'"]'):null;
  currentDetail=null;
  if(trigger) trigger.focus(); else fpBack.focus();
}

function startJourney(){
  if(!currentDetail) return;
  const it=lookup(currentDetail.faceKey,currentDetail.id);
  const f=FACES[currentDetail.faceKey];
  journeyList.innerHTML=LIFECYCLE.map((s,i)=>{
    const lightened=f.color+'cc';
    return '<div class="journey-item">'+
      '<div class="ji-num" style="background:'+f.color+';min-width:32px">'+
        '<i class="ti '+s.icon+' ji-icon" aria-hidden="true"></i>'+
      '</div>'+
      '<div class="ji-content">'+
        '<div class="ji-name">'+s.name+'</div>'+
        '<div class="ji-note">'+s.note(it.name)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
  dsInfo.classList.add('hidden');
  dsJourney.classList.add('active');
}

/* ================================================================
   HERB PANEL
   ================================================================ */
let herbViewMode=0;
const herbPanel=document.getElementById('herbPanel');
const herbScroll=document.getElementById('herbScroll');

function openHerb(){
  herbView(0, document.querySelector('.herb-tab-btn'));
  herbPanel.classList.add('open');
  herbPanel.setAttribute('aria-hidden','false');
  const closeBtn=herbPanel.querySelector('.ibtn');
  if(closeBtn) closeBtn.focus();
}
function closeHerb(){
  herbPanel.classList.remove('open');
  herbPanel.setAttribute('aria-hidden','true');
  document.getElementById('herbBtn').focus();
}
function herbView(v, btn){
  herbViewMode=v;
  document.querySelectorAll('.herb-tab-btn').forEach((b,i)=>{b.classList.toggle('active',i===v);b.setAttribute('aria-selected',i===v?'true':'false');});
  const ageLabel=AGES.find(a=>a.id===ageId).label;
  herbScroll.innerHTML=HERBICIDES.map(h=>{
    let extra='';
    if(v===0) extra=
      '<div class="herb-field"><b>Method:</b> '+h.method+'</div>'+
      '<div class="herb-field"><b>Best for:</b> '+h.best+'</div>'+
      '<div class="herb-caution"><i class="ti ti-alert-triangle"></i><span>'+h.caution+'</span></div>';
    else if(v===1) extra='<div class="herb-age-card"><b>'+ageLabel+'</b>'+(h.age[ageId]||h.age.l)+'</div>';
    else extra='<div class="herb-age-card"><b>Enquiry links</b>'+h.hs.map(s=>'<div style="margin-bottom:3px">· '+s+'</div>').join('')+'</div>';
    return '<div class="herb-item-card">'+
      '<div class="herb-item-name"><i class="ti '+h.icon+'" style="color:var(--ink2)"></i>'+h.name+'</div>'+
      extra+'</div>';
  }).join('');
}
window.herbView=herbView;

document.getElementById('herbBtn').onclick=openHerb;
window.closeHerb=closeHerb;

/* ================================================================
   CONTROLS
   ================================================================ */
document.getElementById('resetBtn').onclick=()=>{
  targetRot.x=-0.3; targetRot.y=-0.55; camDist=8.2; velX=velY=0;
};

const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  themeBtn.querySelector('i').className=dark?'ti ti-moon':'ti ti-sun';
  buildCube(); if(renderer&&scene&&camera) renderer.render(scene,camera);
};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(herbPanel.classList.contains('open')){closeHerb();return;}
    if(detailSheet.classList.contains('open')){closeDetail();return;}
    if(facePanel.classList.contains('open')){closeFacePanel();return;}
  }
  if(!facePanel.classList.contains('open')&&!detailSheet.classList.contains('open')&&!herbPanel.classList.contains('open')&&document.activeElement===canvas){
    const s=0.18;
    if(e.key==='ArrowLeft'){e.preventDefault();targetRot.y-=s;}
    if(e.key==='ArrowRight'){e.preventDefault();targetRot.y+=s;}
    if(e.key==='ArrowUp'){e.preventDefault();targetRot.x=Math.max(-1.3,targetRot.x-s);}
    if(e.key==='ArrowDown'){e.preventDefault();targetRot.x=Math.min(1.3,targetRot.x+s);}
  }
});

function sendPromptSafe(text){
  if(typeof sendPrompt==='function') sendPrompt(text);
  else if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
}
window.sendPromptSafe=sendPromptSafe;
window.startJourney=startJourney;
window.showInfo=showInfo;
window.openDetail=openDetail;
</script>
